# fly.toml app configuration file generated for windows-jjkpoa on 2025-10-18T15:32:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'windows-jjkpoa'
primary_region = 'iad'

[build]

[[mounts]]
  source = 'storage'
  destination = '/storage'

[http_service]
  internal_port = 3389
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 8
  memory_mb = 65536
